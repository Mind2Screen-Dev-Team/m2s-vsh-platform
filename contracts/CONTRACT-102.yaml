# CONTRACT-102 — System Status API
#
# Pemilik: TL/SA
# Status: draft — menunggu approval
# Tanggal: 2026-08-03

api: /api/v1/status
method: GET
summary: Mengembalikan status kesehatan sistem.

response:
  200:
    description: Sistem beroperasi normal atau degraded.
    content-type: application/json
    body:
      status:
        type: string
        enum: ["ok", "degraded"]
        description: Status operasional sistem. "ok" bila semua layanan normal.
      version:
        type: string
        description: Versi backend dalam format semver (contoh: "0.1.0").
      uptime_seconds:
        type: number
        description: Waktu sejak server dimulai, dalam detik.
    example:
      status: "ok"
      version: "0.1.0"
      uptime_seconds: 3600.5
